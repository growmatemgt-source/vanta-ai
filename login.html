<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VANTA AI — Login</title>

    <meta
        name="description"
        content="Sign in to your VANTA AI workspace."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =====================================================
           VANTA AI — LOGIN
           ===================================================== */

        :root {
            --bg: #070A12;
            --surface: #0D1220;
            --surface-2: #111728;

            --primary: #7C5CFF;
            --primary-2: #6242E8;
            --cyan: #22D3EE;

            --text: #F5F7FF;
            --muted: #8992A8;

            --line: rgba(255,255,255,.08);
            --line-strong: rgba(255,255,255,.13);

            --success: #4ADE80;
            --danger: #FB7185;

            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(124,92,255,.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(34,211,238,.08),
                    transparent 28%
                ),
                var(--bg);

            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 75%
                );

            pointer-events: none;
            z-index: -1;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =====================================================
           PAGE
           ===================================================== */

        .auth-page {
            min-height: 100vh;
            display: grid;
            place-items: center;

            padding: 32px 20px;

            position: relative;
        }

        .auth-page::before {
            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(124,92,255,.15),
                    transparent 68%
                );

            filter: blur(15px);

            top: -180px;
            left: -140px;

            pointer-events: none;
        }

        .auth-page::after {
            content: "";

            position: absolute;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(34,211,238,.09),
                    transparent 68%
                );

            filter: blur(15px);

            right: -140px;
            bottom: -170px;

            pointer-events: none;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 470px;

            position: relative;
            z-index: 2;
        }

        /* =====================================================
           BRAND
           ===================================================== */

        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 28px;
        }

        .brand-link {
            display: inline-flex;
            align-items: center;
            gap: 11px;

            font-family: "Space Grotesk", sans-serif;
            font-size: 21px;
            font-weight: 700;

            letter-spacing: -.02em;
        }

        .brand-mark {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--cyan)
                );

            box-shadow:
                0 0 30px rgba(124,92,255,.28);
        }

        .brand-mark span {
            width: 15px;
            height: 15px;

            border: 2px solid white;
            border-radius: 50%;

            position: relative;
        }

        .brand-mark span::after {
            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: white;

            top: 3px;
            left: 3px;
        }

        /* =====================================================
           CARD
           ===================================================== */

        .auth-card {
            width: 100%;

            padding: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17,23,40,.94),
                    rgba(10,14,25,.96)
                );

            border: 1px solid var(--line-strong);

            border-radius: 24px;

            box-shadow:
                0 30px 90px rgba(0,0,0,.42),
                inset 0 1px 0 rgba(255,255,255,.035);

            backdrop-filter: blur(24px);
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 26px;
        }

        .auth-heading h1 {
            font-family: "Space Grotesk", sans-serif;

            font-size: 31px;
            line-height: 1.1;

            letter-spacing: -.04em;

            margin-bottom: 9px;
        }

        .auth-heading p {
            color: var(--muted);

            font-size: 14px;
            line-height: 1.6;
        }

        /* =====================================================
           TABS
           ===================================================== */

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;

            padding: 4px;

            background: rgba(255,255,255,.035);

            border: 1px solid var(--line);

            border-radius: 13px;

            margin-bottom: 24px;
        }

        .auth-tab {
            min-height: 42px;

            border-radius: 9px;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            font-size: 13px;
            font-weight: 700;

            transition:
                background .2s ease,
                color .2s ease,
                box-shadow .2s ease;
        }

        .auth-tab:hover {
            color: var(--text);
        }

        .auth-tab.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(124,92,255,.2),
                    rgba(34,211,238,.08)
                );

            box-shadow:
                inset 0 0 0 1px rgba(124,92,255,.18);
        }

        /* =====================================================
           FORM
           ===================================================== */

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            color: #DDE2F0;

            font-size: 12px;
            font-weight: 700;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;

            min-height: 49px;

            padding:
                0 14px;

            padding-right: 48px;

            border: 1px solid var(--line-strong);

            border-radius: 12px;

            outline: none;

            background:
                rgba(255,255,255,.035);

            color: var(--text);

            font-size: 14px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .input-wrap input::placeholder {
            color: #5F687D;
        }

        .input-wrap input:hover {
            background:
                rgba(255,255,255,.045);
        }

        .input-wrap input:focus {
            border-color:
                rgba(124,92,255,.65);

            background:
                rgba(255,255,255,.05);

            box-shadow:
                0 0 0 4px
                rgba(124,92,255,.10);
        }

        .password-toggle {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 32px;
            height: 32px;

            display: grid;
            place-items: center;

            border-radius: 8px;

            background: transparent;

            color: #747E95;

            cursor: pointer;

            font-size: 13px;

            transition:
                color .2s ease,
                background .2s ease;
        }

        .password-toggle:hover {
            color: white;
            background: rgba(255,255,255,.06);
        }

        /* =====================================================
           FORGOT
           ===================================================== */

        .form-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;

            margin-top: -5px;
            margin-bottom: 19px;
        }

        .forgot-password {
            color: #A99AFF;

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;

            transition: color .2s ease;
        }

        .forgot-password:hover {
            color: var(--cyan);
        }

        /* =====================================================
           BUTTON
           ===================================================== */

        .auth-button {
            width: 100%;

            min-height: 50px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #6950E8
                );

            color: white;

            cursor: pointer;

            font-size: 14px;
            font-weight: 800;

            box-shadow:
                0 12px 28px
                rgba(124,92,255,.20);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                opacity .2s ease;
        }

        .auth-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 16px 34px
                rgba(124,92,255,.30);
        }

        .auth-button:active {
            transform: translateY(0);
        }

        .auth-button:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* =====================================================
           MESSAGE
           ===================================================== */

        .auth-message {
            display: none;

            margin-bottom: 17px;

            padding: 12px 13px;

            border-radius: 11px;

            font-size: 12px;
            line-height: 1.5;
        }

        .auth-message.show {
            display: block;
        }

        .auth-message.success {
            color: #A7F3D0;

            background:
                rgba(74,222,128,.08);

            border:
                1px solid
                rgba(74,222,128,.18);
        }

        .auth-message.error {
            color: #FECDD3;

            background:
                rgba(251,113,133,.08);

            border:
                1px solid
                rgba(251,113,133,.18);
        }

        /* =====================================================
           FOOTER
           ===================================================== */

        .auth-footer {
            text-align: center;

            margin-top: 23px;

            color: #667087;

            font-size: 11px;
            line-height: 1.6;
        }

        .auth-footer a {
            color: #A99AFF;
        }

        .auth-footer a:hover {
            color: var(--cyan);
        }

        .back-home {
            display: flex;
            justify-content: center;

            margin-top: 18px;
        }

        .back-home a {
            color: #727C93;

            font-size: 12px;
            font-weight: 600;

            transition: color .2s ease;
        }

        .back-home a:hover {
            color: white;
        }

        /* =====================================================
           LOADING
           ===================================================== */

        .button-loader {
            width: 16px;
            height: 16px;

            border-radius: 50%;

            border:
                2px solid
                rgba(255,255,255,.3);

            border-top-color: white;

            animation:
                spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 520px) {

            .auth-page {
                padding:
                    24px 15px;
            }

            .auth-card {
                padding: 25px 20px;

                border-radius: 20px;
            }

            .auth-heading h1 {
                font-size: 27px;
            }

            .brand-mark {
                width: 35px;
                height: 35px;
            }

            .brand-link {
                font-size: 19px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <div class="auth-wrapper">

            <!-- =================================================
                 BRAND
                 ================================================= -->

            <div class="auth-brand">

                <a
                    href="index.html"
                    class="brand-link"
                    aria-label="VANTA AI home"
                >

                    <span class="brand-mark">
                        <span></span>
                    </span>

                    <span>VANTA AI</span>

                </a>

            </div>


            <!-- =================================================
                 AUTH CARD
                 ================================================= -->

            <section class="auth-card">

                <div class="auth-heading">

                    <h1 id="authTitle">
                        Welcome back
                    </h1>

                    <p id="authSubtitle">
                        Sign in to access your VANTA AI workspace.
                    </p>

                </div>


                <!-- =================================================
                     TABS
                     ================================================= -->

                <div class="auth-tabs">

                    <button
                        type="button"
                        class="auth-tab active loginTab"
                        data-form="loginForm"
                    >
                        Log in
                    </button>

                    <button
                        type="button"
                        class="auth-tab signupTab"
                        data-form="signupForm"
                    >
                        Create account
                    </button>

                </div>


                <!-- =================================================
                     MESSAGE
                     ================================================= -->

                <div
                    id="authMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- =================================================
                     LOGIN FORM
                     ================================================= -->

                <form
                    id="loginForm"
                    class="auth-form active"
                    novalidate
                >

                    <div class="field">

                        <label for="loginEmail">
                            Email address
                        </label>

                        <div class="input-wrap">

                            <input
                                type="email"
                                id="loginEmail"
                                name="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <div class="field">

                        <label for="loginPassword">
                            Password
                        </label>

                        <div class="input-wrap">

                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="loginPassword"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <div class="form-row">

                        <button
                            type="button"
                            class="forgot-password"
                            id="forgotPassword"
                        >
                            Forgot password?
                        </button>

                    </div>


                    <button
                        type="submit"
                        class="auth-button loginButton"
                    >
                        <span class="button-text">
                            Log in to VANTA
                        </span>
                    </button>

                </form>


                <!-- =================================================
                     SIGNUP FORM
                     ================================================= -->

                <form
                    id="signupForm"
                    class="auth-form"
                    novalidate
                >

                    <div class="field">

                        <label for="signupName">
                            Full name
                        </label>

                        <div class="input-wrap">

                            <input
                                type="text"
                                id="signupName"
                                name="name"
                                placeholder="Your name"
                                autocomplete="name"
                                required
                            >

                        </div>

                    </div>


                    <div class="field">

                        <label for="signupEmail">
                            Email address
                        </label>

                        <div class="input-wrap">

                            <input
                                type="email"
                                id="signupEmail"
                                name="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <div class="field">

                        <label for="signupPassword">
                            Password
                        </label>

                        <div class="input-wrap">

                            <input
                                type="password"
                                id="signupPassword"
                                name="password"
                                placeholder="At least 6 characters"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="signupPassword"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-button signupButton"
                    >
                        <span class="button-text">
                            Create VANTA account
                        </span>
                    </button>

                </form>


                <!-- =================================================
                     FOOTER
                     ================================================= -->

                <div class="auth-footer">
                    By continuing, you agree to use VANTA AI
                    responsibly and according to its service terms.
                </div>

            </section>


            <div class="back-home">

                <a href="index.html">
                    ← Back to VANTA AI
                </a>

            </div>

        </div>

    </main>


    <!-- =========================================================
         SUPABASE
         ========================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>


    <!-- =========================================================
         AUTH SCRIPT
         ========================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                "use strict";


                /* =================================================
                   SUPABASE CLIENT
                   ================================================= */

                const supabase =
                    window.vantaSupabase;


                if (!supabase) {

                    console.error(
                        "VANTA AI: Supabase client not found."
                    );

                    return;
                }


                /* =================================================
                   ELEMENTS
                   ================================================= */

                const loginTab =
                    document.querySelector(
                        ".loginTab"
                    );

                const signupTab =
                    document.querySelector(
                        ".signupTab"
                    );

                const loginForm =
                    document.getElementById(
                        "loginForm"
                    );

                const signupForm =
                    document.getElementById(
                        "signupForm"
                    );

                const authMessage =
                    document.getElementById(
                        "authMessage"
                    );

                const authTitle =
                    document.getElementById(
                        "authTitle"
                    );

                const authSubtitle =
                    document.getElementById(
                        "authSubtitle"
                    );

                const forgotPassword =
                    document.getElementById(
                        "forgotPassword"
                    );


                /* =================================================
                   MESSAGE
                   ================================================= */

                function showMessage(
                    message,
                    type = "error"
                ) {

                    authMessage.textContent =
                        message;

                    authMessage.className =
                        `auth-message show ${type}`;

                }


                function clearMessage() {

                    authMessage.textContent =
                        "";

                    authMessage.className =
                        "auth-message";

                }


                /* =================================================
                   FORM SWITCH
                   ================================================= */

                function switchForm(
                    formName
                ) {

                    clearMessage();

                    if (
                        formName ===
                        "signupForm"
                    ) {

                        loginTab.classList.remove(
                            "active"
                        );

                        signupTab.classList.add(
                            "active"
                        );

                        loginForm.classList.remove(
                            "active"
                        );

                        signupForm.classList.add(
                            "active"
                        );

                        authTitle.textContent =
                            "Create your account";

                        authSubtitle.textContent =
                            "Create your VANTA AI workspace account.";

                    } else {

                        signupTab.classList.remove(
                            "active"
                        );

                        loginTab.classList.add(
                            "active"
                        );

                        signupForm.classList.remove(
                            "active"
                        );

                        loginForm.classList.add(
                            "active"
                        );

                        authTitle.textContent =
                            "Welcome back";

                        authSubtitle.textContent =
                            "Sign in to access your VANTA AI workspace.";

                    }

                }


                loginTab.addEventListener(
                    "click",
                    () => {
                        switchForm(
                            "loginForm"
                        );
                    }
                );


                signupTab.addEventListener(
                    "click",
                    () => {
                        switchForm(
                            "signupForm"
                        );
                    }
                );


                /* =================================================
                   PASSWORD TOGGLES
                   ================================================= */

                document
                    .querySelectorAll(
                        ".password-toggle"
                    )
                    .forEach(
                        (button) => {

                            button.addEventListener(
                                "click",
                                () => {

                                    const targetId =
                                        button.dataset.target;

                                    const input =
                                        document.getElementById(
                                            targetId
                                        );

                                    if (!input) return;


                                    if (
                                        input.type ===
                                        "password"
                                    ) {

                                        input.type =
                                            "text";

                                        button.textContent =
                                            "Hide";

                                        button.setAttribute(
                                            "aria-label",
                                            "Hide password"
                                        );

                                    } else {

                                        input.type =
                                            "password";

                                        button.textContent =
                                            "Show";

                                        button.setAttribute(
                                            "aria-label",
                                            "Show password"
                                        );

                                    }

                                }
                            );

                        }
                    );


                /* =================================================
                   BUTTON LOADING
                   ================================================= */

                function setLoading(
                    button,
                    loading,
                    loadingText
                ) {

                    if (!button) return;

                    if (loading) {

                        button.disabled =
                            true;

                        button.dataset.originalText =
                            button.querySelector(
                                ".button-text"
                            )?.textContent || "";

                        button.innerHTML = `
                            <span class="button-loader"></span>
                            <span class="button-text">
                                ${loadingText}
                            </span>
                        `;

                    } else {

                        button.disabled =
                            false;

                        const original =
                            button.dataset.originalText ||
                            "Continue";

                        button.innerHTML = `
                            <span class="button-text">
                                ${original}
                            </span>
                        `;

                    }

                }


                /* =================================================
                   LOGIN
                   ================================================= */

                loginForm.addEventListener(
                    "submit",
                    async (event) => {

                        event.preventDefault();

                        clearMessage();


                        const email =
                            document
                                .getElementById(
                                    "loginEmail"
                                )
                                .value
                                .trim();

                        const password =
                            document
                                .getElementById(
                                    "loginPassword"
                                )
                                .value;


                        if (!email) {

                            showMessage(
                                "Please enter your email address."
                            );

                            return;
                        }


                        if (!password) {

                            showMessage(
                                "Please enter your password."
                            );

                            return;
                        }


                        if (
                            !email.includes("@")
                        ) {

                            showMessage(
                                "Please enter a valid email address."
                            );

                            return;
                        }


                        const button =
                            document.querySelector(
                                ".loginButton"
                            );


                        setLoading(
                            button,
                            true,
                            "Signing in..."
                        );


                        try {

                            const {
                                data,
                                error
                            } =
                                await supabase.auth
                                    .signInWithPassword({
                                        email,
                                        password
                                    });


                            if (error) {
                                throw error;
                            }


                            if (
                                !data ||
                                !data.session
                            ) {

                                throw new Error(
                                    "Login could not be completed."
                                );

                            }


                            showMessage(
                                "Login successful. Opening your workspace...",
                                "success"
                            );


                            window.setTimeout(
                                () => {

                                    window.location.href =
                                        "dashboard.html";

                                },
                                500
                            );


                        } catch (error) {

                            console.error(
                                "VANTA login error:",
                                error
                            );


                            let message =
                                "Unable to sign in. Please check your details and try again.";


                            if (
                                error.message
                                    ?.toLowerCase()
                                    .includes(
                                        "invalid login credentials"
                                    )
                            ) {

                                message =
                                    "Email or password is incorrect.";

                            } else if (
                                error.message
                                    ?.toLowerCase()
                                    .includes(
                                        "email not confirmed"
                                    )
                            ) {

                                message =
                                    "Please confirm your email address before signing in.";

                            }


                            showMessage(
                                message
                            );

                            setLoading(
                                button,
                                false
                            );

                        }

                    }
                );


                /* =================================================
                   SIGNUP
                   ================================================= */

                signupForm.addEventListener(
                    "submit",
                    async (event) => {

                        event.preventDefault();

                        clearMessage();


                        const name =
                            document
                                .getElementById(
                                    "signupName"
                                )
                                .value
                                .trim();

                        const email =
                            document
                                .getElementById(
                                    "signupEmail"
                                )
                                .value
                                .trim();

                        const password =
                            document
                                .getElementById(
                                    "signupPassword"
                                )
                                .value;


                        if (!name) {

                            showMessage(
                                "Please enter your name."
                            );

                            return;
                        }


                        if (!email) {

                            showMessage(
                                "Please enter your email address."
                            );

                            return;
                        }


                        if (
                            !email.includes("@")
                        ) {

                            showMessage(
                                "Please enter a valid email address."
                            );

                            return;
                        }


                        if (
                            password.length < 6
                        ) {

                            showMessage(
                                "Password must contain at least 6 characters."
                            );

                            return;
                        }


                        const button =
                            document.querySelector(
                                ".signupButton"
                            );


                        setLoading(
                            button,
                            true,
                            "Creating account..."
                        );


                        try {

                            const {
                                data,
                                error
                            } =
                                await supabase.auth
                                    .signUp({

                                        email,

                                        password,

                                        options: {
                                            data: {
                                                full_name:
                                                    name
                                            }
                                        }

                                    });


                            if (error) {
                                throw error;
                            }


                            /*
                              Supabase may require email
                              confirmation depending on
                              the project's Auth settings.
                            */

                            if (
                                data.session
                            ) {

                                showMessage(
                                    "Account created successfully. Opening your workspace...",
                                    "success"
                                );


                                window.setTimeout(
                                    () => {

                                        window.location.href =
                                            "dashboard.html";

                                    },
                                    600
                                );

                            } else {

                                showMessage(
                                    "Account created. Please check your email to confirm your account before signing in.",
                                    "success"
                                );

                                signupForm.reset();

                                setLoading(
                                    button,
                                    false
                                );

                            }


                        } catch (error) {

                            console.error(
                                "VANTA signup error:",
                                error
                            );


                            let message =
                                "Unable to create your account. Please try again.";


                            if (
                                error.message
                                    ?.toLowerCase()
                                    .includes(
                                        "already registered"
                                    )
                            ) {

                                message =
                                    "An account with this email already exists.";

                            }


                            showMessage(
                                message
                            );


                            setLoading(
                                button,
                                false
                            );

                        }

                    }
                );


                /* =================================================
                   FORGOT PASSWORD
                   ================================================= */

                forgotPassword.addEventListener(
                    "click",
                    async () => {

                        clearMessage();


                        const email =
                            document
                                .getElementById(
                                    "loginEmail"
                                )
                                .value
                                .trim();


                        if (!email) {

                            showMessage(
                                "Enter your email address first, then click Forgot password."
                            );

                            document
                                .getElementById(
                                    "loginEmail"
                                )
                                .focus();

                            return;
                        }


                        if (
                            !email.includes("@")
                        ) {

                            showMessage(
                                "Please enter a valid email address."
                            );

                            return;
                        }


                        forgotPassword.disabled =
                            true;

                        forgotPassword.textContent =
                            "Sending...";


                        try {

                            const redirectUrl =
                                `${window.location.origin}/reset-password.html`;


                            const {
                                error
                            } =
                                await supabase.auth
                                    .resetPasswordForEmail(
                                        email,
                                        {
                                            redirectTo:
                                                redirectUrl
                                        }
                                    );


                            if (error) {
                                throw error;
                            }


                            showMessage(
                                "Password reset email sent. Check your inbox and follow the link.",
                                "success"
                            );


                        } catch (error) {

                            console.error(
                                "VANTA password reset error:",
                                error
                            );


                            showMessage(
                                error.message ||
                                "Unable to send the password reset email."
                            );

                        } finally {

                            forgotPassword.disabled =
                                false;

                            forgotPassword.textContent =
                                "Forgot password?";

                        }

                    }
                );


                /* =================================================
                   EXISTING SESSION
                   ================================================= */

                async function checkExistingSession() {

                    try {

                        const {
                            data
                        } =
                            await supabase.auth
                                .getSession();


                        if (
                            data &&
                            data.session
                        ) {

                            window.location.replace(
                                "dashboard.html"
                            );

                        }

                    } catch (error) {

                        console.warn(
                            "VANTA session check:",
                            error
                        );

                    }

                }


                checkExistingSession();

            }
        );

    </script>

</body>
</html>
