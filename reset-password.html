<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VANTA AI — Reset Password</title>

    <meta
        name="description"
        content="Create a new password for your VANTA AI account."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        /* =====================================================
           VANTA AI — RESET PASSWORD
           ===================================================== */

        :root {
            --bg: #070A12;
            --surface: #0D1220;
            --surface-2: #111728;

            --primary: #7C5CFF;
            --primary-2: #6242E8;
            --cyan: #22D3EE;

            --text: #F5F7FF;
            --muted: #8992A8;

            --line: rgba(255,255,255,.08);
            --line-strong: rgba(255,255,255,.13);

            --success: #4ADE80;
            --danger: #FB7185;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family: "DM Sans", sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(124,92,255,.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(34,211,238,.08),
                    transparent 28%
                ),
                var(--bg);

            overflow-x: hidden;
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 75%
                );

            pointer-events: none;

            z-index: -1;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =====================================================
           PAGE
           ===================================================== */

        .auth-page {
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 32px 20px;

            position: relative;
        }

        .auth-page::before {
            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(124,92,255,.15),
                    transparent 68%
                );

            filter: blur(15px);

            top: -180px;
            left: -140px;

            pointer-events: none;
        }

        .auth-page::after {
            content: "";

            position: absolute;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(34,211,238,.09),
                    transparent 68%
                );

            filter: blur(15px);

            right: -140px;
            bottom: -170px;

            pointer-events: none;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 470px;

            position: relative;
            z-index: 2;
        }

        /* =====================================================
           BRAND
           ===================================================== */

        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 28px;
        }

        .brand-link {
            display: inline-flex;
            align-items: center;

            gap: 11px;

            font-family: "Space Grotesk", sans-serif;

            font-size: 21px;
            font-weight: 700;

            letter-spacing: -.02em;
        }

        .brand-mark {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--cyan)
                );

            box-shadow:
                0 0 30px
                rgba(124,92,255,.28);
        }

        .brand-mark span {
            width: 15px;
            height: 15px;

            border: 2px solid white;

            border-radius: 50%;

            position: relative;
        }

        .brand-mark span::after {
            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: white;

            top: 3px;
            left: 3px;
        }

        /* =====================================================
           CARD
           ===================================================== */

        .auth-card {
            width: 100%;

            padding: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17,23,40,.94),
                    rgba(10,14,25,.96)
                );

            border:
                1px solid
                var(--line-strong);

            border-radius: 24px;

            box-shadow:
                0 30px 90px
                rgba(0,0,0,.42),
                inset 0 1px 0
                rgba(255,255,255,.035);

            backdrop-filter: blur(24px);
        }

        /* =====================================================
           ICON
           ===================================================== */

        .reset-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 20px;

            display: grid;
            place-items: center;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    rgba(124,92,255,.18),
                    rgba(34,211,238,.08)
                );

            border:
                1px solid
                rgba(124,92,255,.20);

            box-shadow:
                0 15px 40px
                rgba(124,92,255,.10);
        }

        .reset-icon svg {
            width: 27px;
            height: 27px;

            fill: none;

            stroke:
                #B7AAFF;

            stroke-width: 1.7;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =====================================================
           HEADING
           ===================================================== */

        .auth-heading {
            text-align: center;

            margin-bottom: 27px;
        }

        .auth-heading h1 {
            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 31px;
            line-height: 1.1;

            letter-spacing: -.04em;

            margin-bottom: 10px;
        }

        .auth-heading p {
            color: var(--muted);

            font-size: 14px;

            line-height: 1.65;

            max-width: 350px;

            margin: 0 auto;
        }

        /* =====================================================
           MESSAGE
           ===================================================== */

        .auth-message {
            display: none;

            margin-bottom: 18px;

            padding: 12px 13px;

            border-radius: 11px;

            font-size: 12px;

            line-height: 1.55;
        }

        .auth-message.show {
            display: block;
        }

        .auth-message.success {
            color: #A7F3D0;

            background:
                rgba(74,222,128,.08);

            border:
                1px solid
                rgba(74,222,128,.18);
        }

        .auth-message.error {
            color: #FECDD3;

            background:
                rgba(251,113,133,.08);

            border:
                1px solid
                rgba(251,113,133,.18);
        }

        /* =====================================================
           FIELD
           ===================================================== */

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            color: #DDE2F0;

            font-size: 12px;
            font-weight: 700;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;

            min-height: 50px;

            padding:
                0 48px 0 14px;

            border:
                1px solid
                var(--line-strong);

            border-radius: 12px;

            outline: none;

            background:
                rgba(255,255,255,.035);

            color: var(--text);

            font-size: 14px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .input-wrap input::placeholder {
            color: #5F687D;
        }

        .input-wrap input:hover {
            background:
                rgba(255,255,255,.045);
        }

        .input-wrap input:focus {
            border-color:
                rgba(124,92,255,.65);

            background:
                rgba(255,255,255,.05);

            box-shadow:
                0 0 0 4px
                rgba(124,92,255,.10);
        }

        /* =====================================================
           PASSWORD TOGGLE
           ===================================================== */

        .password-toggle {
            position: absolute;

            right: 10px;
            top: 50%;

            transform:
                translateY(-50%);

            width: 32px;
            height: 32px;

            display: grid;
            place-items: center;

            border-radius: 8px;

            background: transparent;

            color: #747E95;

            cursor: pointer;

            font-size: 12px;
            font-weight: 700;

            transition:
                color .2s ease,
                background .2s ease;
        }

        .password-toggle:hover {
            color: white;

            background:
                rgba(255,255,255,.06);
        }

        /* =====================================================
           PASSWORD REQUIREMENTS
           ===================================================== */

        .password-hint {
            margin-top: 8px;

            color: #69748A;

            font-size: 11px;

            line-height: 1.5;
        }

        .password-strength {
            height: 3px;

            margin-top: 9px;

            border-radius: 10px;

            overflow: hidden;

            background:
                rgba(255,255,255,.06);
        }

        .password-strength-bar {
            width: 0;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--cyan)
                );

            transition:
                width .25s ease;
        }

        /* =====================================================
           BUTTON
           ===================================================== */

        .auth-button {
            width: 100%;

            min-height: 50px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #6950E8
                );

            color: white;

            cursor: pointer;

            font-size: 14px;
            font-weight: 800;

            box-shadow:
                0 12px 28px
                rgba(124,92,255,.20);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                opacity .2s ease;
        }

        .auth-button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 16px 34px
                rgba(124,92,255,.30);
        }

        .auth-button:active {
            transform:
                translateY(0);
        }

        .auth-button:disabled {
            opacity: .6;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        /* =====================================================
           BACK LINK
           ===================================================== */

        .back-link {
            display: flex;

            justify-content: center;

            margin-top: 20px;
        }

        .back-link a {
            color: #727C93;

            font-size: 12px;
            font-weight: 600;

            transition:
                color .2s ease;
        }

        .back-link a:hover {
            color: white;
        }

        /* =====================================================
           LOADER
           ===================================================== */

        .button-loader {
            width: 16px;
            height: 16px;

            border-radius: 50%;

            border:
                2px solid
                rgba(255,255,255,.3);

            border-top-color: white;

            animation:
                spin .7s linear infinite;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 520px) {

            .auth-page {
                padding:
                    24px 15px;
            }

            .auth-card {
                padding:
                    26px 20px;

                border-radius:
                    20px;
            }

            .auth-heading h1 {
                font-size: 27px;
            }

            .brand-mark {
                width: 35px;
                height: 35px;
            }

            .brand-link {
                font-size: 19px;
            }

        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior:
                    auto !important;

                animation-duration:
                    .01ms !important;

                transition-duration:
                    .01ms !important;
            }

        }
    </style>
</head>

<body>

    <main class="auth-page">

        <div class="auth-wrapper">

            <!-- =================================================
                 BRAND
                 ================================================= -->

            <div class="auth-brand">

                <a
                    href="index.html"
                    class="brand-link"
                    aria-label="VANTA AI home"
                >

                    <span class="brand-mark">
                        <span></span>
                    </span>

                    <span>
                        VANTA AI
                    </span>

                </a>

            </div>


            <!-- =================================================
                 CARD
                 ================================================= -->

            <section
                class="auth-card"
                aria-labelledby="resetTitle"
            >

                <!-- Icon -->

                <div class="reset-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="10"
                            width="18"
                            height="11"
                            rx="2"
                        ></rect>

                        <path
                            d="M7 10V7a5 5 0 0 1 10 0v3"
                        ></path>

                        <circle
                            cx="12"
                            cy="15.5"
                            r="1"
                        ></circle>

                        <path
                            d="M12 16.5v2"
                        ></path>

                    </svg>

                </div>


                <!-- Heading -->

                <div class="auth-heading">

                    <h1 id="resetTitle">
                        Create a new password
                    </h1>

                    <p>
                        Choose a strong password for your
                        VANTA AI account.
                    </p>

                </div>


                <!-- Message -->

                <div
                    id="resetMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- =================================================
                     RESET FORM
                     ================================================= -->

                <form
                    id="resetForm"
                    novalidate
                >

                    <div class="field">

                        <label for="newPassword">
                            New password
                        </label>

                        <div class="input-wrap">

                            <input
                                type="password"
                                id="newPassword"
                                name="password"
                                placeholder="Enter your new password"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="newPassword"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                        <div class="password-strength">
                            <div
                                class="password-strength-bar"
                                id="passwordStrengthBar"
                            ></div>
                        </div>

                        <p class="password-hint">
                            Use at least 6 characters. A longer
                            password is recommended.
                        </p>

                    </div>


                    <div class="field">

                        <label for="confirmPassword">
                            Confirm new password
                        </label>

                        <div class="input-wrap">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Enter your password again"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                        id="updatePasswordButton"
                    >

                        <span class="button-text">
                            Update password
                        </span>

                    </button>

                </form>


                <!-- Back -->

                <div class="back-link">

                    <a href="login.html">
                        ← Back to login
                    </a>

                </div>

            </section>

        </div>

    </main>


    <!-- =========================================================
         SUPABASE
         ========================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>


    <!-- =========================================================
         RESET PASSWORD LOGIC
         ========================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                "use strict";


                /* =================================================
                   SUPABASE
                   ================================================= */

                const supabase =
                    window.vantaSupabase;


                if (!supabase) {

                    console.error(
                        "VANTA AI: Supabase client not found."
                    );

                    return;
                }


                /* =================================================
                   ELEMENTS
                   ================================================= */

                const resetForm =
                    document.getElementById(
                        "resetForm"
                    );

                const resetMessage =
                    document.getElementById(
                        "resetMessage"
                    );

                const newPassword =
                    document.getElementById(
                        "newPassword"
                    );

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    );

                const updateButton =
                    document.getElementById(
                        "updatePasswordButton"
                    );

                const strengthBar =
                    document.getElementById(
                        "passwordStrengthBar"
                    );


                /* =================================================
                   MESSAGE
                   ================================================= */

                function showMessage(
                    message,
                    type = "error"
                ) {

                    resetMessage.textContent =
                        message;

                    resetMessage.className =
                        `auth-message show ${type}`;

                }


                function clearMessage() {

                    resetMessage.textContent =
                        "";

                    resetMessage.className =
                        "auth-message";

                }


                /* =================================================
                   PASSWORD TOGGLE
                   ================================================= */

                document
                    .querySelectorAll(
                        ".password-toggle"
                    )
                    .forEach(
                        (button) => {

                            button.addEventListener(
                                "click",
                                () => {

                                    const target =
                                        document.getElementById(
                                            button.dataset.target
                                        );

                                    if (!target) {
                                        return;
                                    }


                                    if (
                                        target.type ===
                                        "password"
                                    ) {

                                        target.type =
                                            "text";

                                        button.textContent =
                                            "Hide";

                                        button.setAttribute(
                                            "aria-label",
                                            "Hide password"
                                        );

                                    } else {

                                        target.type =
                                            "password";

                                        button.textContent =
                                            "Show";

                                        button.setAttribute(
                                            "aria-label",
                                            "Show password"
                                        );

                                    }

                                }
                            );

                        }
                    );


                /* =================================================
                   PASSWORD STRENGTH
                   ================================================= */

                function updatePasswordStrength(
                    password
                ) {

                    if (!strengthBar) return;

                    let strength = 0;


                    if (
                        password.length >= 6
                    ) {
                        strength += 25;
                    }

                    if (
                        password.length >= 10
                    ) {
                        strength += 20;
                    }

                    if (
                        /[A-Z]/.test(password)
                    ) {
                        strength += 20;
                    }

                    if (
                        /[0-9]/.test(password)
                    ) {
                        strength += 20;
                    }

                    if (
                        /[^A-Za-z0-9]/.test(password)
                    ) {
                        strength += 15;
                    }


                    strengthBar.style.width =
                        `${Math.min(
                            strength,
                            100
                        )}%`;

                }


                newPassword.addEventListener(
                    "input",
                    () => {

                        updatePasswordStrength(
                            newPassword.value
                        );

                    }
                );


                /* =================================================
                   BUTTON LOADING
                   ================================================= */

                function setLoading(
                    loading
                ) {

                    if (loading) {

                        updateButton.disabled =
                            true;

                        updateButton.innerHTML = `
                            <span class="button-loader"></span>
                            <span class="button-text">
                                Updating...
                            </span>
                        `;

                    } else {

                        updateButton.disabled =
                            false;

                        updateButton.innerHTML = `
                            <span class="button-text">
                                Update password
                            </span>
                        `;

                    }

                }


                /* =================================================
                   AUTH STATE
                   ================================================= */

                let recoverySession =
                    false;


                /*
                  Supabase can establish the recovery
                  session from the access token contained
                  in the URL after the email link is opened.
                */

                supabase.auth.onAuthStateChange(
                    (event, session) => {

                        if (
                            event ===
                            "PASSWORD_RECOVERY"
                        ) {

                            recoverySession =
                                true;

                        }

                    }
                );


                /* =================================================
                   CHECK SESSION
                   ================================================= */

                try {

                    const {
                        data,
                        error
                    } =
                        await supabase.auth
                            .getSession();


                    if (error) {

                        console.warn(
                            "VANTA recovery session:",
                            error
                        );

                    }


                    if (
                        data &&
                        data.session
                    ) {

                        recoverySession =
                            true;

                    }

                } catch (error) {

                    console.warn(
                        "VANTA session check:",
                        error
                    );

                }


                /* =================================================
                   UPDATE PASSWORD
                   ================================================= */

                resetForm.addEventListener(
                    "submit",
                    async (event) => {

                        event.preventDefault();

                        clearMessage();


                        const password =
                            newPassword.value;

                        const confirmation =
                            confirmPassword.value;


                        /* -----------------------------------------
                           Validation
                           ----------------------------------------- */

                        if (
                            password.length < 6
                        ) {

                            showMessage(
                                "Your new password must contain at least 6 characters."
                            );

                            newPassword.focus();

                            return;

                        }


                        if (
                            password !==
                            confirmation
                        ) {

                            showMessage(
                                "The passwords do not match."
                            );

                            confirmPassword.focus();

                            return;

                        }


                        if (
                            password.length < 10 &&
                            !/[0-9]/.test(password)
                        ) {

                            /*
                              Not blocking the user.
                              Just keep the validation
                              practical and simple.
                            */

                        }


                        setLoading(true);


                        try {

                            /*
                              Supabase uses the active
                              recovery session created
                              by the password reset link.
                            */

                            const {
                                data,
                                error
                            } =
                                await supabase.auth
                                    .updateUser({
                                        password
                                    });


                            if (error) {
                                throw error;
                            }


                            if (!data) {

                                throw new Error(
                                    "Password update could not be completed."
                                );

                            }


                            showMessage(
                                "Your password has been updated successfully. Redirecting to your workspace...",
                                "success"
                            );


                            /*
                              Give the success message
                              enough time to be visible.
                            */

                            window.setTimeout(
                                async () => {

                                    try {

                                        await supabase.auth
                                            .signOut();

                                    } catch (signOutError) {

                                        console.warn(
                                            "VANTA sign-out after reset:",
                                            signOutError
                                        );

                                    }


                                    window.location.href =
                                        "login.html";

                                },
                                1400
                            );


                        } catch (error) {

                            console.error(
                                "VANTA password update error:",
                                error
                            );


                            let message =
                                "Unable to update your password. Please request a new reset link and try again.";


                            if (
                                error.message
                                    ?.toLowerCase()
                                    .includes(
                                        "session"
                                    )
                            ) {

                                message =
                                    "Your password reset session has expired. Please request a new reset link.";

                            }


                            showMessage(
                                message
                            );

                            setLoading(
                                false
                            );

                        }

                    }
                );


            }
        );

    </script>

</body>
</html>
